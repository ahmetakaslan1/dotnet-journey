services:
  postgres-db: 
    image: postgres:latest
    container_name: pg-lesson9
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5439:5432"
    volumes:
      # Projeyi taşıdığımızda verilerin kaybolmaması için klasöre bağlıyoruz
      - ./pgdata:/var/lib/postgresql

  mysql-db:
    image: mysql:latest
    container_name: mysql-lesson9
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: mysqldemo
    ports:
      - "3309:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
