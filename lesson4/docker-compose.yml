version: '3.8'

services:
  postgres-db:
    image: postgres:latest
    container_name: pg-lesson4
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"

  mysql-db:
    image: mysql:latest
    container_name: mysql-lesson4
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: mysqldemo
    ports:
      - "3306:3306"
