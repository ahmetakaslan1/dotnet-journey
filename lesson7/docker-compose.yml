version: "3.8"

services:
  postgres-dbxxx: # Buradaki Opsiyonel bir isimlendirme
    image: postgres:latest
    container_name: pg-lesson7
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      # Projeyi taşıdığımızda verilerin kaybolmaması için klasöre bağlıyoruz
      - ./pgdata:/var/lib/postgresql

  mysql-db:
    image: mysql:latest
    container_name: mysql-lesson7
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: mysqldemo
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
