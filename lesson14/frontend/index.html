<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify - Kurumsal Görev Yöneticisi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    
    <!-- Giriş ve Kayıt Ekranı -->
    <div class="glass-panel auth-panel" id="authPanel">
        <h1 class="logo">Taskify</h1>
        <p class="subtitle">Görevlerinizi güvenle yönetin.</p>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Giriş Yap</button>
            <button class="tab-btn" onclick="switchTab('register')">Kayıt Ol</button>
        </div>

        <div id="authError" class="error-box hidden"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>E-posta</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label>İsim</label>
                <input type="text" id="registerName" required>
            </div>
            <div class="form-group">
                <label>E-posta</label>
                <input type="email" id="registerEmail" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="registerPassword" required>
            </div>
            <button type="submit" class="btn">Kayıt Ol</button>
        </form>
    </div>

    <!-- Görevler (Dashboard) Ekranı -->
    <div class="glass-panel dashboard-panel hidden" id="dashboardPanel">
        <div class="dashboard-header">
            <h2>Görevlerim</h2>
            <button onclick="logout()" class="btn-outline">Çıkış Yap</button>
        </div>
        
        <div class="add-task-box">
            <input type="text" id="newTaskTitle" placeholder="Yeni görev başlığı...">
            <button onclick="addTask()" class="btn">Ekle</button>
        </div>

        <ul class="task-list" id="taskList">
            <!-- Görevler buraya JS ile yüklenecek -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
